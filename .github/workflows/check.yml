name: check
on: [push, pull_request]
jobs:
  contenido:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Sintaxis de todos los .js
        run: node scripts/check.js
      - name: Contenido (idiomas, árabe, dibujos, grabaciones)
        run: node scripts/lint.js
      - name: Vocabulario (las 250 palabras más frecuentes y la lista para chicos)
        run: |
          node scripts/cobertura.js --lang=es --check
          node scripts/cobertura.js --lang=en --check
          node scripts/cobertura.js --lang=es --ninos --check
